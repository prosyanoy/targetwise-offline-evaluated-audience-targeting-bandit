[project]
name = "targetwise"
version = "0.1.0"
description = "Contextual-bandit audience targeting with offline policy evaluation"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn", "scipy"]

[tool.setuptools]
packages = ["targetwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
